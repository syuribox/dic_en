<h2>概要</h2>
<p>主に外来語のカタカナ語の簡易辞書です。<br>
</p>
<div id="bodypart">
</div>
<div id="bodypart2">
</div>
<hr>
<p>
注意事項として英語翻訳作業には、役に立ちません。<br>
例えば：ゴムはオランダ語[<a href="one_page.html#gom">gom</a>]、ガムは[<a href="one_page.html#gum">gum</a>]と割り当てられていますが、英語ではどちらも[gum]です。<br>
フライドポテトはそのままこの辞書では原音の通り[<a href="one_page.html#fried_potato">fried_potato</a>]ですが、英語ではfrench friesと呼ばれます。<br>
チャーハンもそのまま[<a href="one_page.html#chahan">chahan</a>]ですが、英語ではfried riceです。<br>
</p>
